name: Release (VS Code Extension)

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      mode:
        description: Release mode
        type: choice
        required: true
        default: full
        options:
          - full
          - resume_from_tag
      bump:
        description: Semver bump (full mode; ignored when version is set)
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: Explicit version (full mode; overrides bump), e.g. 1.2.3
        type: string
        required: false
      github_tag:
        description: Existing git tag (resume_from_tag mode), e.g. v1.2.3
        type: string
        required: false
      publish_to_marketplace:
        description: Publish to VS Code Marketplace (vsce publish)
        type: boolean
        required: true
        default: false
      create_github_release:
        description: Create GitHub Release
        type: boolean
        required: true
        default: true
      upload_vsix_to_github:
        description: Upload VSIX and SHA-256 checksum to GitHub Release
        type: boolean
        required: true
        default: true
      draft:
        description: Keep the completed GitHub Release as a draft
        type: boolean
        required: true
        default: false
      dry_run:
        description: Dry-run (no file changes, no publish)
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Activate pinned npm
        run: |
          set -euo pipefail
          package_manager="$(node -p "require('./package.json').packageManager")"
          expected_version="${package_manager#npm@}"
          corepack enable npm
          corepack prepare "${package_manager}" --activate
          test "$(npm --version)" = "${expected_version}"

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preserve current release tooling
        if: ${{ github.event_name == 'push' || inputs.mode == 'resume_from_tag' }}
        run: cp scripts/release.mts "${RUNNER_TEMP}/release.mts"

      - name: Select ref
        env:
          RELEASE_MODE: ${{ github.event_name == 'push' && 'resume_from_tag' || inputs.mode }}
          REQUESTED_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.github_tag }}
        run: |
          set -euo pipefail

          git fetch --prune --force origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/*:refs/tags/*"

          if [ "${RELEASE_MODE}" = "resume_from_tag" ]; then
            if [ -z "${REQUESTED_TAG}" ]; then
              echo "Input 'github_tag' is required when mode=resume_from_tag."
              exit 1
            fi
            raw_tag="${REQUESTED_TAG}"
            tag="${raw_tag}"

            if ! git check-ref-format "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Invalid git tag: ${raw_tag}"
              exit 1
            fi

            if ! git show-ref --verify --quiet "refs/tags/${tag}"; then
              if [ "${raw_tag#v}" = "${raw_tag}" ]; then
                candidate="v${raw_tag}"
                if git show-ref --verify --quiet "refs/tags/${candidate}"; then
                  tag="${candidate}"
                fi
              fi
            fi

            if ! git show-ref --verify --quiet "refs/tags/${tag}"; then
              echo "Git tag not found: ${raw_tag}"
              exit 1
            fi

            echo "RELEASE_TAG=${tag}" >> "${GITHUB_ENV}"
            git checkout --detach "refs/tags/${tag}"
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${tag}^{commit}")"
            exit 0
          fi

          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Full releases must be run on the 'main' branch (current: ${GITHUB_REF_NAME})."
            exit 1
          fi

          dispatched_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          remote_main_sha="$(git rev-parse "refs/remotes/origin/main^{commit}")"
          if [ "${dispatched_sha}" != "${remote_main_sha}" ]; then
            echo "main advanced after this workflow was dispatched."
            echo "Dispatched: ${dispatched_sha}"
            echo "origin/main: ${remote_main_sha}"
            echo "Run the release workflow again from the latest main commit."
            exit 1
          fi

          git checkout -B main "${remote_main_sha}"
          test "$(git rev-parse HEAD)" = "${remote_main_sha}"

      - name: Validate stable release tag
        if: ${{ github.event_name == 'push' || inputs.mode == 'resume_from_tag' }}
        run: |
          node - <<'JS'
          const tag = process.env.RELEASE_TAG;
          const pkg = require('./package.json');
          if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag ?? '') || tag !== `v${pkg.version}`) {
            throw new Error('Release tag must be stable and match package.json version.');
          }
          JS

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npm run check

      - name: Provision VS Code on CI runner
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          curl --fail --location --retry 3 \
            https://update.code.visualstudio.com/latest/linux-deb-x64/stable \
            --output "${RUNNER_TEMP}/vscode.deb"
          sudo apt-get update
          sudo apt-get install --yes "${RUNNER_TEMP}/vscode.deb"

      - name: Run extension host tests
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: xvfb-run -a npm run test:e2e

      - name: Validate secrets
        if: ${{ github.event_name != 'push' && !inputs.dry_run && inputs.publish_to_marketplace }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT}" ]; then
            echo "Missing VSCE_PAT secret (required for VS Code Marketplace publishing)."
            exit 1
          fi

      - name: Determine release staging state
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_MODE: ${{ github.event_name == 'push' && 'resume_from_tag' || inputs.mode }}
          CREATE_GITHUB_RELEASE: ${{ github.event_name == 'push' || inputs.create_github_release }}
          UPLOAD_VSIX_TO_GITHUB: ${{ github.event_name == 'push' || inputs.upload_vsix_to_github }}
        run: |
          set -euo pipefail
          build_draft=true
          if [ "${RELEASE_MODE}" = "resume_from_tag" ] && { [ "${CREATE_GITHUB_RELEASE}" = "true" ] || [ "${UPLOAD_VSIX_TO_GITHUB}" = "true" ]; }; then
            if metadata="$(gh release view "${RELEASE_TAG}" --json isDraft 2>"${RUNNER_TEMP}/release-state-error.txt")"; then
              build_draft="$(printf '%s' "${metadata}" | node -e "let s='';process.stdin.on('data',x=>s+=x);process.stdin.on('end',()=>{const d=JSON.parse(s).isDraft;if(typeof d!=='boolean')throw Error('Invalid release state');process.stdout.write(String(d));});")"
            elif ! grep -Eqi 'release not found|HTTP 404' "${RUNNER_TEMP}/release-state-error.txt"; then
              echo "Unable to read release state; refusing to assume the release is absent."
              exit 1
            fi
          fi
          echo "RELEASE_BUILD_DRAFT=${build_draft}" >> "${GITHUB_ENV}"

      - name: Run release script
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ github.event_name == 'push' && 'resume_from_tag' || inputs.mode }}
          REQUESTED_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ github.event_name != 'push' && inputs.dry_run }}
          PUBLISH_TO_MARKETPLACE: ${{ github.event_name != 'push' && inputs.publish_to_marketplace }}
          CREATE_GITHUB_RELEASE: ${{ github.event_name == 'push' || inputs.create_github_release }}
          UPLOAD_VSIX_TO_GITHUB: ${{ github.event_name == 'push' || inputs.upload_vsix_to_github }}
        run: |
          set -euo pipefail

          args=(--yes)

          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi

          if [ "${RELEASE_BUILD_DRAFT:-true}" = "true" ]; then
            args+=(--draft)
          fi

          if [ "${PUBLISH_TO_MARKETPLACE}" != "true" ]; then
            args+=(--skip-publish)
          fi

          if [ "${CREATE_GITHUB_RELEASE}" != "true" ] && [ "${UPLOAD_VSIX_TO_GITHUB}" != "true" ]; then
            args+=(--skip-github)
          else
            if [ "${CREATE_GITHUB_RELEASE}" != "true" ]; then
              args+=(--skip-github-create)
            fi
            if [ "${UPLOAD_VSIX_TO_GITHUB}" != "true" ]; then
              args+=(--skip-github-upload)
            fi
          fi

          if [ "${RELEASE_MODE}" = "resume_from_tag" ]; then
            if [ -z "${RELEASE_TAG:-}" ]; then
              echo "Missing RELEASE_TAG."
              exit 1
            fi
            args+=(--resume-from-tag "${RELEASE_TAG}" --auto-notes)
          else
            if [ -n "${REQUESTED_VERSION}" ]; then
              args+=(--version "${REQUESTED_VERSION}")
            else
              args+=(--bump "${{ inputs.bump }}")
            fi
          fi

          if [ "${RELEASE_MODE}" = "resume_from_tag" ]; then
            export PATH="${PWD}/node_modules/.bin:${PATH}"
            resume_script="${PWD}/scripts/.release-resume.mts"
            cp "${RUNNER_TEMP}/release.mts" "${resume_script}"
            trap 'rm -f "${resume_script}"' EXIT
            node "${resume_script}" "${args[@]}"
          else
            npm run release -- "${args[@]}"
          fi

      - name: Publish completed GitHub Release
        if: ${{ (github.event_name == 'push' || !inputs.dry_run) && (github.event_name == 'push' || inputs.create_github_release) && (github.event_name == 'push' || !inputs.draft) }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_MODE: ${{ github.event_name == 'push' && 'resume_from_tag' || inputs.mode }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [ "${RELEASE_MODE}" != "resume_from_tag" ]; then
            tag="v$(node -p "require('./package.json').version")"
          fi
          draft="$(gh release view "${tag}" --json isDraft --jq '.isDraft')"
          if [ "${draft}" = "true" ]; then
            make_latest=true
            if latest="$(gh api "repos/${GH_REPO}/releases/latest" --jq '.tag_name' 2>"${RUNNER_TEMP}/release-latest-error.txt")"; then
              make_latest="$(node - "${tag}" "${latest}" <<'JS'
          const parse = (tag) => /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag) ? tag.slice(1).split('.').map(Number) : undefined;
          const target = parse(process.argv[2]), existing = parse(process.argv[3]);
          if (!target) throw Error('Invalid target release version');
          let latest = true;
          if (existing) {
            for (let i = 0; i < 3; i++) {
              if (target[i] !== existing[i]) { latest = target[i] > existing[i]; break; }
            }
          }
          process.stdout.write(String(latest));
          JS
              )"
            elif ! grep -Eqi 'HTTP 404|Not Found' "${RUNNER_TEMP}/release-latest-error.txt"; then
              echo "Unable to reconcile the latest release."
              exit 1
            fi
            gh release edit "${tag}" --draft=false "--latest=${make_latest}"
          elif [ "${draft}" != "false" ]; then
            echo "Unexpected release state."
            exit 1
          fi
          gh release view "${tag}" --json tagName,isDraft,url
