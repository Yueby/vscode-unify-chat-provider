name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Activate pinned npm
        run: |
          set -euo pipefail
          package_manager="$(node -p "require('./package.json').packageManager")"
          expected_version="${package_manager#npm@}"
          corepack enable npm
          corepack prepare "${package_manager}" --activate
          test "$(npm --version)" = "${expected_version}"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Provision VS Code on CI runner
        run: |
          curl --fail --location --retry 3 \
            https://update.code.visualstudio.com/latest/linux-deb-x64/stable \
            --output "${RUNNER_TEMP}/vscode.deb"
          sudo apt-get update
          sudo apt-get install --yes "${RUNNER_TEMP}/vscode.deb"

      - name: Run extension host tests
        run: xvfb-run -a npm run test:e2e
